# GitHub Actions: runs the API test suite in GitHub's cloud on every push and pull request to main.
# Same command as the Jenkinsfile. No browser needed, so no headless setup.
name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven      # reuse downloaded dependencies between runs

      # A failing test fails this step, so the run shows red.
      - name: Run API tests
        run: mvn -B clean test

      # always(): keep the reports even when tests fail - that's exactly when you need them
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
